name: Build and Release Manuscript

on:
    push:
        branches:
            - main
        paths:
            - "historical-microbes_manuscript.qmd"
            - "manuscript_preamble.tex"
            - "bibliography.bib"
            - "figures/**"
            - "_quarto.yml"
            - ".github/workflows/**"
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-manuscript:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Quarto and TinyTeX
              uses: quarto-dev/quarto-actions/setup@v2
              with:
                  tinytex: true

            - name: Install Elsevier journal extension
              run: quarto add quarto-journals/elsevier --no-prompt

            - name: Compile PDF manuscript
              run: quarto render historical-microbes_manuscript.qmd --to elsevier-pdf

            - name: Upload compiled PDF artifact
              uses: actions/upload-artifact@v4
              with:
                  name: historical-microbes-manuscript-pdf
                  path: historical-microbes_manuscript.pdf
                  if-no-files-found: error

            - name: Publish or update latest release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: latest
                  name: "Latest Manuscript Build"
                  body: |
                      Automated CI/CD build of the academic review manuscript.

                      Deliverables:
                      - historical-microbes_manuscript.pdf (compiled manuscript)
                      - course-submission_cover-page.pdf (official course cover page)
                  files: |
                      historical-microbes_manuscript.pdf
                      course-submission_cover-page.pdf
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
